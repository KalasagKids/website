<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Collections · Kalasag Kids</title>
  <meta name="description" content="Every video, mini-game, and safety poster, all in one place.">
  <meta name="theme-color" content="#0a0b1f">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/icons/favicon-64.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/pixelify-sans-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/collection.css">
  <link rel="stylesheet" href="vendor/pixel-pencil-cursor/pencil-cursor.css">
  <!-- Apply saved language + theme before first paint (read-only; js/core/state.js owns storage). -->
  <script>try{var d=document.documentElement,s=localStorage;if(s.getItem("kalasag:lang")==='"fil"')d.dataset.lang="fil";d.dataset.theme=JSON.parse(s.getItem("kalasag:theme"))||"night"}catch(e){document.documentElement.dataset.theme="night"}</script>
  <script src="vendor/pixel-pencil-cursor/pencil-cursor.js" defer></script>
  <script type="module" src="js/main.js"></script>
</head>
<body data-page="collection">
  <header class="site-header" data-site-header></header>

  <!-- collection.js renders the aside (All · Videos · Games · Posters · Quizzes) and the groups. -->
  <main id="main" class="container page"></main>

  <footer class="site-footer" data-site-footer></footer>
</body>
</html>
